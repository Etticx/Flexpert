<!DOCTYPE html>
<html>
<head>
    <title>Expert System Fixes Test</title>
</head>
<body>
    <h1>Testing Expert System Fixes</h1>
    <div id="results"></div>

    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script>
        // Test Case 1: Muscle Gain + Slim (should get specific exercises, not defaults)
        console.log("=== TEST 1: Muscle Gain + Slim ===");
        const test1 = {
            goal: "muscle_gain",
            body_type: "slim", 
            limitations: "none",
            duration: "20-30",
            environment: "gym",
            intensity: "high",
            days: "3-4"
        };
        const result1 = window.InferenceEngine.run(test1);
        console.log("Strategy:", result1.strategy);
        console.log("Exercises:", result1.exercises);
        console.log("Exercise Count:", result1.exercises.length);

        // Test Case 2: Fat Loss + Upper Injury (should get goal-specific safe exercises)
        console.log("\n=== TEST 2: Fat Loss + Upper Injury ===");
        const test2 = {
            goal: "fat_loss",
            body_type: "average",
            limitations: "upper_injury", 
            duration: "10-15",
            environment: "home",
            intensity: "moderate",
            days: "2-3"
        };
        const result2 = window.InferenceEngine.run(test2);
        console.log("Strategy:", result2.strategy);
        console.log("Exercises:", result2.exercises);
        console.log("Exercise Count:", result2.exercises.length);

        // Test Case 3: Duration filtering (10-15 min should have fewer exercises)
        console.log("\n=== TEST 3: Duration Filtering ===");
        const test3 = {
            goal: "strength",
            body_type: "broad",
            limitations: "none",
            duration: "10-15", // Should limit to 3 exercises
            environment: "gym",
            intensity: "high",
            days: "5-6"
        };
        const result3 = window.InferenceEngine.run(test3);
        console.log("Strategy:", result3.strategy);
        console.log("Exercises:", result3.exercises);
        console.log("Exercise Count (should be 3):", result3.exercises.length);

        // Test Case 4: Safety Rule Explanation Test
        console.log("\n=== TEST 4: Safety Rule Explanations ===");
        const test4 = {
            goal: "muscle_gain",
            body_type: "broad",
            limitations: "upper_injury", // Should trigger safety rule with explanation
            duration: "20-30",
            environment: "gym",
            intensity: "high",
            days: "3-4"
        };
        const result4 = window.InferenceEngine.run(test4);
        console.log("Strategy:", result4.strategy);
        console.log("Explanation:", result4.explanation);
        console.log("Exercises:", result4.exercises);

        // Test Case 5: Broad Guy Home Edge Case
        console.log("\n=== TEST 5: Broad Guy Home Edge Case ===");
        const test5 = {
            goal: "muscle_gain",
            body_type: "broad",
            limitations: "none",
            duration: "30-40",
            environment: "home", // Should trigger the new specific rule
            intensity: "high",
            days: "3-4"
        };
        const result5 = window.InferenceEngine.run(test5);
        console.log("Strategy:", result5.strategy);
        console.log("Explanation:", result5.explanation);
        console.log("Exercises:", result5.exercises);

        // Display results
        document.getElementById('results').innerHTML = `
            <h2>Test Results</h2>
            <h3>Test 1: Muscle Gain + Slim</h3>
            <p><strong>Strategy:</strong> ${result1.strategy}</p>
            <p><strong>Exercises (${result1.exercises.length}):</strong> ${result1.exercises.join(', ')}</p>
            
            <h3>Test 2: Fat Loss + Upper Injury</h3>
            <p><strong>Strategy:</strong> ${result2.strategy}</p>
            <p><strong>Exercises (${result2.exercises.length}):</strong> ${result2.exercises.join(', ')}</p>
            <p><strong>Explanation:</strong> ${result2.explanation}</p>
            
            <h3>Test 3: Duration Filtering (10-15 min)</h3>
            <p><strong>Strategy:</strong> ${result3.strategy}</p>
            <p><strong>Exercises (${result3.exercises.length}):</strong> ${result3.exercises.join(', ')}</p>
            
            <h3>Test 4: Safety Rule Explanations</h3>
            <p><strong>Strategy:</strong> ${result4.strategy}</p>
            <p><strong>Explanation:</strong> ${result4.explanation}</p>
            <p><strong>Exercises:</strong> ${result4.exercises.join(', ')}</p>
            
            <h3>Test 5: Broad Guy Home Edge Case</h3>
            <p><strong>Strategy:</strong> ${result5.strategy}</p>
            <p><strong>Explanation:</strong> ${result5.explanation}</p>
            <p><strong>Exercises:</strong> ${result5.exercises.join(', ')}</p>
        `;
    </script>
</body>
</html>
