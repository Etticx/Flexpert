<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexpert - AI Fitness Coach</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;900&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/flexpertlogo.png">
</head>

<body>
    <header>
        <div class="logo-container">
            <!-- <i class="fas fa-dumbbell logo-icon"></i> -->
            <img src="img/flexpertlogo.png" alt="Flexpert Logo" class="logo-img"
                style="height: 60px; margin-right: 15px;">
            <h1 class="logo-text">FLEXPERT</h1>
        </div>
        <p class="tagline">INTELLIGENT WORKOUT SYSTEMS</p>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">
            <i class="fas fa-clipboard-list"></i> Loading...
        </div>
    </header>

    <main>
        <!-- Question Card -->
        <div class="card animate__animated animate__fadeIn" id="questionCard">
            <button class="back-btn" id="backBtn" style="display: none;">
                <i class="fas fa-arrow-left"></i> Back
            </button>

            <div class="question-container">
                <h2 class="question-text" id="questionText">Loading...</h2>
                <div class="options-container" id="optionsContainer">
                    <!-- Options injected here -->
                </div>

                <!-- Input for text questions if needed -->
                <!-- Action Buttons (Submit) -->
                <div class="action-buttons" id="actionButtons" style="display: none;">
                    <button class="btn btn-primary" id="submitBtn">
                        Get My Plan <i class="fas fa-bolt"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Result Card -->
        <div class="result-card animate__animated animate__zoomIn" id="resultCard" style="display: none;">
            <div class="result-header">
                <i class="fas fa-trophy trophy-icon"></i>
                <h2>Your Personalized Plan</h2>
                <button id="downloadPdfBtn" class="btn-primary"
                    style="margin: 0 auto; display: flex; font-size: 0.9rem; padding: 0.5rem 1rem;">
                    <i class="fas fa-file-pdf"></i> Download PDF
                </button>
            </div>

            <div id="resultContent">
                <!-- Results injected here -->
            </div>

            <!-- AI Chat Section -->
            <div id="aiChatSection" class="chat-container">
                <div class="chat-header">
                    <h3><i class="fas fa-robot"></i> Flexpert AI Chat</h3>
                </div>

                <!-- API Key Input Removed as per user request (Hardcoded now) -->

                <div id="chatMessages" class="chat-messages">
                    <!-- Messages go here -->
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Ask about form, nutrition, etc..." />
                    <button id="sendChatBtn">
                        <i class="fas fa-paper-plane"></i> Send
                    </button>
                </div>
            </div>

            <div style="text-align: center; margin-top: 2rem;">
                <button class="btn btn-secondary" id="restartBtn">
                    <i class="fas fa-redo"></i> Start Over
                </button>
            </div>
        </div>
    </main>

    <!-- HTML2PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
