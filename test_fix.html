<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flexpert Logic Test</title>
</head>

<body>
    <h1>Flexpert Logic Test</h1>
    <div id="output"></div>

    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script>
        function log(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            document.body.appendChild(div);
            console.log(msg);
        }

        // Test Case: Lower Injury + Home
        // Before Fix: Would include "Lat Pulldown (Seated)" (Machine) and "Bench Press" (Barbell)
        // Expected After Fix: Should FILTER OUT those, and only keep compatible ones or fallbacks.

        const userAnswers = {
            goal: "muscle_gain",
            body_type: "average",
            days: "3-4",
            limitations: "lower_injury", // TRIGGERS SAFETY RULE (Prescribes Gym stuff)
            environment: "home",         // TRIGGERS EQUIPMENT RULE (Only Dumbbells)
            intensity: "moderate",
            duration: "30-40"
        };

        log("Running Inference with: " + JSON.stringify(userAnswers));
        const result = window.InferenceEngine.run(userAnswers);

        log("--- RESULT ---");
        log("Strategy: " + result.strategy);
        log("Equipment: " + JSON.stringify(result.equipment));
        log("Exercises: " + JSON.stringify(result.exercises));

        // Validation
        const impossible = ["Lat pulldown (Seated)", "Bench press", "Leg Press"];
        const hasImpossible = result.exercises.some(ex => impossible.includes(ex));

        if (hasImpossible) {
            log("❌ FAIL: Plan contains impossible exercises for Home environment!");
        } else {
            log("✅ PASS: Impossible exercises filtered out.");
        }

        // Check Strategy Name
        if (result.strategy.includes("Hypertrophy")) {
            log("⚠️ WARNING: Strategy name might still be aggressive: " + result.strategy);
        } else {
            log("✅ PASS: Strategy name seems neutral: " + result.strategy);
        }

    </script>
</body>

</html>
